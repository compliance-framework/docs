name: Test Build

on:
  # Runs on pushes to any branch
  push: {}
  
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrency group per branch: builds on different branches (other PRs,
# merges to main) run in parallel instead of cancelling each other. A newer
# push to the same branch still supersedes the older run, except on main,
# where a build that has started is always left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test scripts
        run: yarn test
      - name: Build
        run: yarn build
