subjectTemplates:
  - name: gitlab-repository
    description: >-
      A GitLab repository (project) in the configured group. Title: `GitLab Repository: {{ .repository }}`. The
      `repository` value is the project path, not the full path with the group. The evidence also carries `provider`
      (`gitlab`) and `type` (`repository`) labels that are not part of the identity.
    identityKeys:
      - name: "repository"
        description: "Path of the GitLab project, such as `billing-service`."
      - name: "group"
        description: "The `group` setting of the plugin: the numeric ID or full path of the GitLab group that owns the repository."
    example:
      name: gitlab-repository
      type: component
      title: "GitLab Repository: billing-service"
      description: GitLab repository billing-service in group acme-platform
      purpose: Represents a GitLab repository being monitored for compliance
      identityLabels:
        repository: billing-service
        group: acme-platform
