version: 1
policyInput:
  description: >-
    The plugin evaluates one kind of resource, an S3 bucket, and a policy receives one document per bucket as `input`.
    The document has two top-level keys: `bucket`, the identity of the bucket, and `bucket_context`, everything the plugin
    read about it. A bundle is matched by its name, `aws-s3-policies`. Fields are listed by their path inside the document;
    a field marked as left out is missing from the document, not null, so test for it with `object.get` or a default.
    The `bucket_context` object always has `current`, `bucket_home_region` and one object for each setting below (`encryption`,
    `public_access_block`, `policy`, `policy_status`, `ownership_controls`, `versioning`, `object_lock`, `lifecycle`,
    `replication`, `logging`, `website`), but a setting the bucket does not have is an empty object, or has its fields left out.
  fields:
    - name: "bucket"
      type: "object"
      description: "The bucket itself."
    - name: "bucket.name"
      type: "string"
      description: "Bucket name."
    - name: "bucket.arn"
      type: "string"
      description: "Bucket ARN, `arn:aws:s3:::<name>`."
    - name: "bucket.region"
      type: "string"
      description: "Region the bucket lives in. `us-east-1` when S3 reports no location, and `eu-west-1` for the legacy `EU` location."
    - name: "bucket.creation_date"
      type: "string (RFC 3339 time)"
      description: "When the bucket was created. Left out when S3 returns no date."
    - name: "bucket_context"
      type: "object"
      description: "What the plugin read about the bucket. The fields below are all inside it."
    - name: "bucket_context.bucket_home_region"
      type: "string"
      description: "Region the bucket lives in, same as `bucket.region`."
    - name: "bucket_context.tags"
      type: "object (string to string)"
      description: "The bucket's tags. Left out when the bucket has none."
    - name: "bucket_context.policy_hash"
      type: "string"
      description: "SHA-256 hex digest of the bucket policy text. Left out when there is no bucket policy."
    - name: "bucket_context.current"
      type: "object"
      description: "Summary flags computed from the rest of the context, the easiest thing for a policy to test. Fields:"
    - name: "bucket_context.current.bucket_name"
      type: "string"
      description: "Bucket name."
    - name: "bucket_context.current.bucket_arn"
      type: "string"
      description: "Bucket ARN."
    - name: "bucket_context.current.region"
      type: "string"
      description: "Bucket region."
    - name: "bucket_context.current.tags_present"
      type: "boolean"
      description: "True when the bucket has at least one tag."
    - name: "bucket_context.current.is_public"
      type: "boolean"
      description: "True when S3 reports the bucket policy as public. False when there is no bucket policy."
    - name: "bucket_context.current.encryption_enabled"
      type: "boolean"
      description: "True when the bucket has at least one default encryption rule."
    - name: "bucket_context.current.uses_kms"
      type: "boolean"
      description: "True when a default encryption rule uses `aws:kms`."
    - name: "bucket_context.current.ownership_enforced"
      type: "boolean"
      description: "True when object ownership is `BucketOwnerEnforced`."
    - name: "bucket_context.current.is_versioned"
      type: "boolean"
      description: "True when versioning status is `Enabled`."
    - name: "bucket_context.current.mfa_delete_enabled"
      type: "boolean"
      description: "True when MFA delete is `Enabled`."
    - name: "bucket_context.current.object_lock_enabled"
      type: "boolean"
      description: "True when Object Lock is enabled."
    - name: "bucket_context.current.has_lifecycle_rules"
      type: "boolean"
      description: "True when the bucket has at least one lifecycle rule."
    - name: "bucket_context.current.lifecycle_min_expiration_days"
      type: "integer"
      description: "Smallest `expiration_days` across lifecycle rules that set one. 0 when none does."
    - name: "bucket_context.current.has_noncurrent_version_expiration"
      type: "boolean"
      description: "True when any lifecycle rule expires noncurrent versions."
    - name: "bucket_context.current.logging_enabled"
      type: "boolean"
      description: "True when server access logging has a target bucket."
    - name: "bucket_context.current.replication_enabled"
      type: "boolean"
      description: "True when at least one replication rule has status `Enabled`."
    - name: "bucket_context.current.website_hosting_enabled"
      type: "boolean"
      description: "True when static website hosting is configured."
    - name: "bucket_context.encryption.rules"
      type: "array of objects"
      description: "Default encryption rules. Left out when the bucket has no default encryption (`encryption` is then an empty object)."
    - name: "bucket_context.encryption.rules[].algorithm"
      type: "string"
      description: "`AES256`, `aws:kms` or `aws:kms:dsse`."
    - name: "bucket_context.encryption.rules[].kms_key_arn"
      type: "string"
      description: "KMS key the rule names. Left out when none is named."
    - name: "bucket_context.encryption.rules[].bucket_key_enabled"
      type: "boolean"
      description: "Whether S3 Bucket Keys are on."
    - name: "bucket_context.public_access_block.block_public_acls"
      type: "boolean"
      description: "Block public ACLs. All four are false when the bucket has no public access block."
    - name: "bucket_context.public_access_block.ignore_public_acls"
      type: "boolean"
      description: "Ignore public ACLs. All four are false when the bucket has no public access block."
    - name: "bucket_context.public_access_block.block_public_policy"
      type: "boolean"
      description: "Block public bucket policies. All four are false when the bucket has no public access block."
    - name: "bucket_context.public_access_block.restrict_public_buckets"
      type: "boolean"
      description: "Restrict access to buckets with public policies. All four are false when the bucket has no public access block."
    - name: "bucket_context.policy.raw"
      type: "string"
      description: "The bucket policy as the JSON string S3 returns. Left out when there is no bucket policy."
    - name: "bucket_context.policy_status.is_public"
      type: "boolean"
      description: "Whether S3 evaluates the bucket policy as public."
    - name: "bucket_context.ownership_controls.object_ownership"
      type: "string"
      description: "`BucketOwnerEnforced`, `BucketOwnerPreferred` or `ObjectWriter`. Left out when no ownership controls are set."
    - name: "bucket_context.versioning.status"
      type: "string"
      description: "`Enabled` or `Suspended`. Left out when versioning was never turned on."
    - name: "bucket_context.versioning.mfa_delete"
      type: "string"
      description: "`Enabled` or `Disabled`. Left out when S3 returns none."
    - name: "bucket_context.object_lock.enabled"
      type: "boolean"
      description: "Whether Object Lock is enabled."
    - name: "bucket_context.object_lock.default_retention_mode"
      type: "string"
      description: "`GOVERNANCE` or `COMPLIANCE`. Left out when there is no default retention."
    - name: "bucket_context.object_lock.default_retention_days"
      type: "integer"
      description: "Default retention in days. Left out when 0."
    - name: "bucket_context.object_lock.default_retention_years"
      type: "integer"
      description: "Default retention in years. Left out when 0."
    - name: "bucket_context.lifecycle.rules"
      type: "array of objects"
      description: "Lifecycle rules. Left out when the bucket has none. Each rule has the fields below."
    - name: "bucket_context.lifecycle.rules[].id"
      type: "string"
      description: "Rule ID. Left out when empty."
    - name: "bucket_context.lifecycle.rules[].status"
      type: "string"
      description: "`Enabled` or `Disabled`."
    - name: "bucket_context.lifecycle.rules[].expiration_days"
      type: "integer"
      description: "Days until current objects expire. Left out when 0."
    - name: "bucket_context.lifecycle.rules[].noncurrent_version_expiration_days"
      type: "integer"
      description: "Days until noncurrent versions expire. Left out when 0."
    - name: "bucket_context.lifecycle.rules[].abort_incomplete_multipart_upload_after_days"
      type: "integer"
      description: "Days after which incomplete multipart uploads are aborted. Left out when 0."
    - name: "bucket_context.lifecycle.rules[].expired_object_delete_marker"
      type: "boolean"
      description: "Whether expired object delete markers are removed."
    - name: "bucket_context.replication.role"
      type: "string"
      description: "IAM role ARN used for replication. Left out when there is no replication."
    - name: "bucket_context.replication.rules"
      type: "array of objects"
      description: "Replication rules that have a destination. Left out when there are none."
    - name: "bucket_context.replication.rules[].id"
      type: "string"
      description: "Rule ID. Left out when empty."
    - name: "bucket_context.replication.rules[].status"
      type: "string"
      description: "`Enabled` or `Disabled`."
    - name: "bucket_context.replication.rules[].destination_bucket_arn"
      type: "string"
      description: "ARN of the destination bucket."
    - name: "bucket_context.logging.target_bucket"
      type: "string"
      description: "Bucket that receives access logs. Left out when logging is off."
    - name: "bucket_context.logging.target_prefix"
      type: "string"
      description: "Prefix of the log objects. Left out when empty."
    - name: "bucket_context.website.hosting_enabled"
      type: "boolean"
      description: "Whether static website hosting is configured."
    - name: "bucket_context.website.index_suffix"
      type: "string"
      description: "Index document suffix. Left out when empty."
  example:
    bucket:
      name: acme-payments-audit-logs
      arn: arn:aws:s3:::acme-payments-audit-logs
      region: eu-west-1
      creation_date: "2025-03-14T08:22:41Z"
    bucket_context:
      current:
        bucket_name: acme-payments-audit-logs
        bucket_arn: arn:aws:s3:::acme-payments-audit-logs
        region: eu-west-1
        tags_present: true
        is_public: false
        encryption_enabled: true
        uses_kms: true
        ownership_enforced: true
        is_versioned: true
        mfa_delete_enabled: false
        object_lock_enabled: true
        has_lifecycle_rules: true
        lifecycle_min_expiration_days: 365
        has_noncurrent_version_expiration: true
        logging_enabled: true
        replication_enabled: false
        website_hosting_enabled: false
      bucket_home_region: eu-west-1
      tags:
        Environment: production
      encryption:
        rules:
          - algorithm: aws:kms
            kms_key_arn: arn:aws:kms:eu-west-1:111122223333:key/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            bucket_key_enabled: true
      public_access_block:
        block_public_acls: true
        ignore_public_acls: true
        block_public_policy: true
        restrict_public_buckets: true
      policy:
        raw: '{"Version":"2012-10-17","Statement":[{"Sid":"DenyInsecureTransport","Effect":"Deny","Principal":"*","Action":"s3:*","Resource":["arn:aws:s3:::acme-payments-audit-logs","arn:aws:s3:::acme-payments-audit-logs/*"],"Condition":{"Bool":{"aws:SecureTransport":"false"}}}]}'
      policy_hash: 9f2b6c1e0d4a7385b1c3e8f4a60d2c57e91b3a8d4f6c0e2a7b5d9138c4e6f0a2
      policy_status:
        is_public: false
      ownership_controls:
        object_ownership: BucketOwnerEnforced
      versioning:
        status: Enabled
        mfa_delete: Disabled
      object_lock:
        enabled: true
        default_retention_mode: COMPLIANCE
        default_retention_days: 365
      lifecycle:
        rules:
          - id: expire-old-logs
            status: Enabled
            expiration_days: 365
            noncurrent_version_expiration_days: 30
            abort_incomplete_multipart_upload_after_days: 7
            expired_object_delete_marker: false
      replication: {}
      logging:
        target_bucket: acme-access-logs
        target_prefix: s3/acme-payments-audit-logs/
      website:
        hosting_enabled: false
subjectTemplates:
  - name: aws-s3-bucket
    description: >-
      An Amazon S3 bucket. Title: `AWS S3 bucket {{ .bucket_name }} in {{ .region }}`. The evidence also carries
      `type` (`bucket`) and `resource_arn` labels that are not part of the identity.
    identityKeys:
      - name: "provider"
        description: "Cloud provider, always `aws`."
      - name: "region"
        description: "Region the bucket lives in."
      - name: "bucket_name"
        description: "Name of the bucket."
    example:
      name: aws-s3-bucket
      type: component
      title: AWS S3 bucket acme-payments-audit-logs in eu-west-1
      description: Amazon S3 bucket acme-payments-audit-logs in AWS region eu-west-1.
      purpose: Represents an Amazon S3 bucket evaluated for storage compliance posture.
      identityLabels:
        provider: aws
        region: eu-west-1
        bucket_name: acme-payments-audit-logs
