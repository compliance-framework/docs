version: 1
policyInput:
  description: >-
    The plugin evaluates GitHub repositories and passes alerts to a policy as `input`. What `input` looks like depends on the
    plugin's `operational-mode`. In `Bundled` mode (the default) a policy runs once per repository and receives one object with
    the keys `alerts` and `security_team_members`. In `Granular` mode a policy runs once per alert, and receives an array that
    holds that single alert. The alert objects are the same in both modes: the Dependabot alert as the GitHub REST API returns
    it, and every alert field below is left out of the document, not null, when GitHub does not send it, so test for it with
    `object.get` or a default. Alerts in all four states (`open`, `fixed`, `dismissed`, `auto_dismissed`) are included, so a
    policy that only cares about open alerts has to filter on `state`. Repositories that the token cannot read alerts for are
    skipped and no policy runs for them. Fields are listed by their path inside an alert; `alerts[]` is the alert in Bundled
    mode, and `input[0]` is the same alert in Granular mode.
  fields:
    - name: "alerts"
      type: "array of alert objects"
      description: "Bundled mode only. Every Dependabot alert of the repository, in all four states. An empty array when the repository has none."
    - name: "security_team_members"
      type: "array of objects"
      description: "Bundled mode only. The members of the GitHub team named by `security-team-name`, as GitHub user objects (`login`, `id`, `html_url`, `type` and the rest of the user). Left out when no security team is configured; an empty array when the team has no members."
    - name: "alerts[].number"
      type: "integer"
      description: "Alert number within the repository."
    - name: "alerts[].state"
      type: "string"
      description: "`open`, `fixed`, `dismissed` or `auto_dismissed`."
    - name: "alerts[].dependency.package.ecosystem"
      type: "string"
      description: "Package ecosystem of the vulnerable dependency, such as `go`, `npm` or `pip`."
    - name: "alerts[].dependency.package.name"
      type: "string"
      description: "Name of the vulnerable package."
    - name: "alerts[].dependency.manifest_path"
      type: "string"
      description: "Path of the manifest file that declares the dependency."
    - name: "alerts[].dependency.scope"
      type: "string"
      description: "`runtime` or `development`. Left out when GitHub does not report a scope."
    - name: "alerts[].security_advisory.ghsa_id"
      type: "string"
      description: "GitHub advisory ID (`GHSA-...`)."
    - name: "alerts[].security_advisory.cve_id"
      type: "string"
      description: "CVE ID. Left out when the advisory has none."
    - name: "alerts[].security_advisory.summary"
      type: "string"
      description: "One-line summary of the advisory."
    - name: "alerts[].security_advisory.description"
      type: "string"
      description: "Full advisory text, in Markdown."
    - name: "alerts[].security_advisory.severity"
      type: "string"
      description: "Advisory severity: `low`, `medium`, `high` or `critical`."
    - name: "alerts[].security_advisory.classification"
      type: "string"
      description: "Advisory classification, such as `general` or `malware`. Left out when GitHub does not send it."
    - name: "alerts[].security_advisory.cvss.score"
      type: "number"
      description: "CVSS base score, 0 to 10."
    - name: "alerts[].security_advisory.cvss.vector_string"
      type: "string"
      description: "CVSS vector string. Left out when the advisory has no vector."
    - name: "alerts[].security_advisory.cvss_severities"
      type: "object"
      description: "CVSS scores by version, `cvss_v3` and `cvss_v4`, each with `score` and `vector_string`. Left out when GitHub does not send it."
    - name: "alerts[].security_advisory.cwes"
      type: "array of objects"
      description: "Weakness classes, each with `cwe_id` and `name`."
    - name: "alerts[].security_advisory.epss"
      type: "object"
      description: "Exploit Prediction Scoring System data, with `percentage` and `percentile`. Left out when GitHub does not send it."
    - name: "alerts[].security_advisory.identifiers"
      type: "array of objects"
      description: "Other identifiers of the advisory, each with `type` (`GHSA` or `CVE`) and `value`."
    - name: "alerts[].security_advisory.references"
      type: "array of objects"
      description: "Links about the advisory, each with `url`."
    - name: "alerts[].security_advisory.vulnerabilities"
      type: "array of objects"
      description: "Every package version range the advisory covers, each with `package` (`ecosystem`, `name`), `severity`, `vulnerable_version_range` and `first_patched_version.identifier`."
    - name: "alerts[].security_advisory.published_at"
      type: "string (RFC 3339 time)"
      description: "When the advisory was published."
    - name: "alerts[].security_advisory.updated_at"
      type: "string (RFC 3339 time)"
      description: "When the advisory was last updated."
    - name: "alerts[].security_advisory.withdrawn_at"
      type: "string (RFC 3339 time)"
      description: "When the advisory was withdrawn. Left out for advisories that were not."
    - name: "alerts[].security_vulnerability.package.ecosystem"
      type: "string"
      description: "Ecosystem of the package version range that applies to this alert."
    - name: "alerts[].security_vulnerability.package.name"
      type: "string"
      description: "Package name of the range that applies to this alert."
    - name: "alerts[].security_vulnerability.severity"
      type: "string"
      description: "Severity of the range that applies to this alert: `low`, `medium`, `high` or `critical`. The policy-friendly severity of the alert."
    - name: "alerts[].security_vulnerability.vulnerable_version_range"
      type: "string"
      description: "Vulnerable versions, such as `< 1.4.2`."
    - name: "alerts[].security_vulnerability.first_patched_version.identifier"
      type: "string"
      description: "First version with a fix. The `first_patched_version` object is left out when no fix exists."
    - name: "alerts[].url"
      type: "string"
      description: "API URL of the alert."
    - name: "alerts[].html_url"
      type: "string"
      description: "Web URL of the alert."
    - name: "alerts[].created_at"
      type: "string (RFC 3339 time)"
      description: "When the alert was created."
    - name: "alerts[].updated_at"
      type: "string (RFC 3339 time)"
      description: "When the alert was last updated."
    - name: "alerts[].fixed_at"
      type: "string (RFC 3339 time)"
      description: "When the alert was fixed. Left out unless `state` is `fixed`."
    - name: "alerts[].dismissed_at"
      type: "string (RFC 3339 time)"
      description: "When the alert was dismissed. Left out unless it was dismissed."
    - name: "alerts[].dismissed_by"
      type: "object"
      description: "GitHub user who dismissed the alert (`login`, `id`, `html_url`, `type` and the rest of the user). Left out unless it was dismissed by a person."
    - name: "alerts[].dismissed_reason"
      type: "string"
      description: "Reason given for dismissing the alert, such as `no_bandwidth` or `tolerable_risk`. Left out unless it was dismissed."
    - name: "alerts[].dismissed_comment"
      type: "string"
      description: "Comment left when dismissing the alert. Left out when there is none."
    - name: "alerts[].auto_dismissed_at"
      type: "string (RFC 3339 time)"
      description: "When GitHub dismissed the alert automatically. Left out unless `state` is `auto_dismissed`."
    - name: "alerts[].repository"
      type: "object"
      description: "The repository, as GitHub returns it. Left out when GitHub does not send it."
  example:
    alerts:
      - number: 14
        state: open
        dependency:
          package:
            ecosystem: npm
            name: example-markdown-parser
          manifest_path: web/package-lock.json
          scope: runtime
        security_advisory:
          ghsa_id: GHSA-abcd-1234-wxyz
          cve_id: CVE-2099-12345
          summary: example-markdown-parser allows script injection through crafted link targets
          description: "### Impact\nCrafted link targets are rendered without escaping.\n\n### Patches\nFixed in 2.3.1."
          severity: high
          cvss:
            score: 7.4
            vector_string: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N
          cwes:
            - cwe_id: CWE-79
              name: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')
          identifiers:
            - type: GHSA
              value: GHSA-abcd-1234-wxyz
            - type: CVE
              value: CVE-2099-12345
          references:
            - url: https://example.com/advisories/CVE-2099-12345
          vulnerabilities:
            - package:
                ecosystem: npm
                name: example-markdown-parser
              severity: high
              vulnerable_version_range: "< 2.3.1"
              first_patched_version:
                identifier: 2.3.1
          published_at: "2099-01-10T09:00:00Z"
          updated_at: "2099-01-12T14:30:00Z"
        security_vulnerability:
          package:
            ecosystem: npm
            name: example-markdown-parser
          severity: high
          vulnerable_version_range: "< 2.3.1"
          first_patched_version:
            identifier: 2.3.1
        url: https://api.github.com/repos/example-org/example-repo/dependabot/alerts/14
        html_url: https://github.com/example-org/example-repo/security/dependabot/14
        created_at: "2099-01-11T08:15:00Z"
        updated_at: "2099-01-11T08:15:00Z"
      - number: 9
        state: dismissed
        dependency:
          package:
            ecosystem: go
            name: example.com/acme/netutil
          manifest_path: go.mod
          scope: runtime
        security_advisory:
          ghsa_id: GHSA-efgh-5678-stuv
          summary: acme/netutil panics on malformed headers
          severity: medium
          cvss:
            score: 5.3
        security_vulnerability:
          package:
            ecosystem: go
            name: example.com/acme/netutil
          severity: medium
          vulnerable_version_range: "< 0.8.0"
          first_patched_version:
            identifier: 0.8.0
        html_url: https://github.com/example-org/example-repo/security/dependabot/9
        created_at: "2098-11-02T10:00:00Z"
        updated_at: "2098-11-20T16:45:00Z"
        dismissed_at: "2098-11-20T16:45:00Z"
        dismissed_by:
          login: example-maintainer
          id: 1001
          html_url: https://github.com/example-maintainer
          type: User
        dismissed_reason: tolerable_risk
        dismissed_comment: Only reachable from internal tooling.
    security_team_members:
      - login: example-secops
        id: 1002
        html_url: https://github.com/example-secops
        type: User
subjectTemplates:
  - name: dependabot-repository
    description: >-
      A GitHub repository whose Dependabot alerts are evaluated. Title: `Dependabot for repository: {{ .repository }}`.
      The evidence also carries `provider` (`github`) and `type` labels that are not part of the identity: `type` is
      `repository` in Bundled mode and `dependabot` in Granular mode, where each alert's evidence also carries `cve_id`,
      `package_name`, `ecosystem`, `severity`, `impact` and `cvss_score` labels.
    identityKeys:
      - name: "repository"
        description: "Name of the GitHub repository, without the organization."
      - name: "organization"
        description: "GitHub organization (or owner login) of the repository."
    example:
      name: dependabot-repository
      type: component
      title: "Dependabot for repository: example-repo"
      description: Dependabot alerts for GitHub repository example-repo in organization example-org
      purpose: Represents Dependabot monitoring for a GitHub repository being evaluated for compliance
      identityLabels:
        repository: example-repo
        organization: example-org
