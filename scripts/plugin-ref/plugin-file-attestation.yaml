version: 1
policyInput:
  description: >-
    One run tracks one file, the `file_path` setting, and its attestation, and evaluates every policy package against
    one document that a policy receives as `input`. The document is the same whether the file is local or remote.
    When the file doesn't exist, the document still reaches the policies, with `exists` false and `attestation` left
    out as `null`, so a policy can record the missing file as evidence. When the file exists but its attestation can't
    be fetched, `attestation` is set with `exists` false and the reason in `error`. Fields are listed by their name in
    the document; the ones under `attestation` have the prefix `attestation.`. Your own policy data from the agent
    configuration is in `data.<key>`, not in `input`.
  fields:
    - name: "path"
      type: "string"
      description: "The `file_path` setting after normalisation: an absolute filesystem path becomes a `file://` URI, a relative path and any URI stay as written."
    - name: "content"
      type: "string"
      description: "The file's content as text. Empty when the file doesn't exist."
    - name: "exists"
      type: "boolean"
      description: "True when the file was found. A file that returns HTTP 404, or is missing on disk, counts as not existing, and so does one that could not be read."
    - name: "sha"
      type: "string"
      description: "SHA-256 of the file's content, in lower-case hexadecimal. Left out when the file doesn't exist."
    - name: "sha512"
      type: "string"
      description: "SHA-512 of the file's content, in lower-case hexadecimal. Left out when the file doesn't exist."
    - name: "attestation"
      type: "object or null"
      description: "The attestation found for the file. `null` when the file doesn't exist, so test for it before reading the fields below. The object is present even when no `attestation_path` is set, with `exists` false."
    - name: "attestation.path"
      type: "string"
      description: "The `attestation_path` setting after the same normalisation as `path`."
    - name: "attestation.exists"
      type: "boolean"
      description: "True when the attestation was found and could be read."
    - name: "attestation.verified"
      type: "boolean"
      description: "True when the attestation is a Sigstore bundle the plugin could parse (it has a `mediaType` or transparency log entries), or a DSSE envelope with at least one signature. The plugin doesn't check the signature itself: use `signer_identity` and `signer_issuer` to decide who you trust."
    - name: "attestation.signer_identity"
      type: "string"
      description: "Who signed: the first email address, URI or DNS name in the signing certificate's subject alternative names for a Sigstore bundle, the first signature's `keyid` for a DSSE envelope. Empty when none could be read."
    - name: "attestation.signer_issuer"
      type: "string"
      description: "Who issued the signing identity: the Fulcio issuer extension of the certificate, or the certificate issuer's common name when there is none. Empty for a DSSE envelope."
    - name: "attestation.subject_digest_alg"
      type: "string"
      description: "Algorithm of the first subject digest in the attestation's in-toto statement: `sha256` or `sha512` when present, otherwise the first one listed. Left out when there is no digest."
    - name: "attestation.subject_digest"
      type: "string"
      description: "The digest value for `subject_digest_alg`. Compare it with `sha` or `sha512`. Left out when there is no digest."
    - name: "attestation.timestamp"
      type: "string"
      description: "The `integratedTime` of the first transparency log entry, as the bundle writes it (seconds since the epoch, as text). Empty when there is none."
    - name: "attestation.error"
      type: "string"
      description: "Why the attestation couldn't be fetched or understood, such as `unrecognized attestation format`. Left out when there was no problem."
    - name: "authorized_signers"
      type: "array of strings"
      description: "The `authorized_signers` setting split on commas, with spaces trimmed. `null` when the setting is empty. Match it against `attestation.signer_identity`."
  example:
    path: file:///etc/myapp/config.yaml
    content: |
      listen: 0.0.0.0:8080
    exists: true
    sha: 3b1c8f0f6c1b6f0e0b7d3a1f9e6c2d4a5b8e7f90a1c2d3e4f5a6b7c8d9e0f1a2
    sha512: 9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
    attestation:
      path: https://attest.example.com/config.yaml.att.json
      exists: true
      verified: true
      signer_identity: alice@example.com
      signer_issuer: https://accounts.google.com
      subject_digest_alg: sha256
      subject_digest: 3b1c8f0f6c1b6f0e0b7d3a1f9e6c2d4a5b8e7f90a1c2d3e4f5a6b7c8d9e0f1a2
      timestamp: "1767225600"
    authorized_signers:
      - alice@example.com
      - bob@example.com
subjectTemplates:
  - name: Tracked Local Host File Attestation
    description: >-
      One subject per local file and host, registered when the agent calls `Init`. It applies to evidence whose
      `source` label is `local`: a relative path, an absolute path or a `file://` URI. Title:
      `Tracked local file attestation target: '{{.file}}' on host '{{.host}}'`. The evidence also carries the
      `provider` (`file`) and `type` (`attestation`) labels, and any labels from the `policy_labels` setting.
    identityKeys:
      - name: "host"
        description: "The hostname of the machine the plugin runs on."
      - name: "file"
        description: "The absolute path of the tracked file. A relative `file_path` is resolved against the agent's working directory."
      - name: "_plugin"
        description: "The name the plugin has in the agent configuration, set by the agent (`file_attestation` in the sample configuration)."
    example:
      name: Tracked Local Host File Attestation
      type: component
      title: "Tracked local file attestation target: '/etc/myapp/config.yaml' on host 'web-01'"
      description: Tracked local file '/etc/myapp/config.yaml' on host 'web-01' and its associated attestation evidence
      purpose: Represents a host-backed local file artifact being monitored for existence, attestation availability, signer authorization, and digest integrity
      selectorLabels:
        source: local
      identityLabels:
        host: web-01
        file: /etc/myapp/config.yaml
        _plugin: file_attestation
  - name: Tracked Remote File Attestation
    description: >-
      One subject per remote file and host, registered when the agent calls `Init`. It applies to evidence whose
      `source` label is `remote`: an `http://`, `https://` or `oci://` URI. Title:
      `Tracked remote file attestation target: '{{.file}}' from host '{{.host}}'`. The evidence also carries the
      `provider` (`file`) and `type` (`attestation`) labels, and any labels from the `policy_labels` setting.
    identityKeys:
      - name: "host"
        description: "The domain of the URI, without a port."
      - name: "file"
        description: "The path of the URI without the domain and the leading `/`, as written (percent-encoding kept)."
      - name: "_plugin"
        description: "The name the plugin has in the agent configuration, set by the agent (`file_attestation` in the sample configuration)."
    example:
      name: Tracked Remote File Attestation
      type: component
      title: "Tracked remote file attestation target: 'releases/app/config.yaml' from host 'artifacts.example.com'"
      description: Tracked remote file or artifact 'releases/app/config.yaml' from host 'artifacts.example.com' and its associated attestation evidence
      purpose: Represents a remote file artifact being monitored for existence, attestation availability, signer authorization, and digest integrity
      selectorLabels:
        source: remote
      identityLabels:
        host: artifacts.example.com
        file: releases/app/config.yaml
        _plugin: file_attestation
