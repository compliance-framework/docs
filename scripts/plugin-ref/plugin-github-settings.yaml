version: 1
policyInput:
  description: >-
    The plugin evaluates one kind of resource, a GitHub organization (the one set in the plugin's `organization` setting),
    and a policy receives one document per run as `input`. There is no separate repository document. The document has five
    top-level keys: `settings`, `teams`, `members`, `sso` and `ip_allow_list`. `settings`, `teams` and `members` are always
    present; `sso` and `ip_allow_list` are `null` when they could not be collected. The plugin continues with partial data
    when the teams, members, SSO or IP allow-list requests fail, so a policy should check for an empty or `null` value before
    it judges one. Fields of GitHub objects are left out of the document when GitHub does not return them, not null, so test
    for them with `object.get` or a default. A bundle is matched by its name, `plugin-github-settings-policies`. Fields are
    listed by their path inside the document.
  fields:
    - name: "settings"
      type: "object"
      description: "The organization as GitHub's `GET /orgs/{org}` returns it. Every field below is left out when GitHub does not return it, so test with a default."
    - name: "settings.login"
      type: "string"
      description: "Organization login name."
    - name: "settings.id"
      type: "integer"
      description: "Numeric organization ID."
    - name: "settings.node_id"
      type: "string"
      description: "GraphQL node ID."
    - name: "settings.name"
      type: "string"
      description: "Display name."
    - name: "settings.description"
      type: "string"
      description: "Organization description."
    - name: "settings.company"
      type: "string"
      description: "Company name."
    - name: "settings.blog"
      type: "string"
      description: "Website URL."
    - name: "settings.location"
      type: "string"
      description: "Location."
    - name: "settings.email"
      type: "string"
      description: "Public contact email."
    - name: "settings.twitter_username"
      type: "string"
      description: "Twitter/X username."
    - name: "settings.billing_email"
      type: "string"
      description: "Billing email address."
    - name: "settings.type"
      type: "string"
      description: "Account type, `Organization`."
    - name: "settings.html_url"
      type: "string"
      description: "Web URL of the organization."
    - name: "settings.url"
      type: "string"
      description: "API URL of the organization."
    - name: "settings.avatar_url"
      type: "string"
      description: "Avatar image URL."
    - name: "settings.created_at"
      type: "string (RFC 3339 time)"
      description: "When the organization was created."
    - name: "settings.updated_at"
      type: "string (RFC 3339 time)"
      description: "When the organization was last updated."
    - name: "settings.archived_at"
      type: "string (RFC 3339 time)"
      description: "When the organization was archived."
    - name: "settings.public_repos"
      type: "integer"
      description: "Number of public repositories."
    - name: "settings.public_gists"
      type: "integer"
      description: "Number of public gists."
    - name: "settings.followers"
      type: "integer"
      description: "Number of followers."
    - name: "settings.following"
      type: "integer"
      description: "Number of accounts followed."
    - name: "settings.total_private_repos"
      type: "integer"
      description: "Total private repositories."
    - name: "settings.owned_private_repos"
      type: "integer"
      description: "Private repositories owned by the organization."
    - name: "settings.private_gists"
      type: "integer"
      description: "Number of private gists."
    - name: "settings.disk_usage"
      type: "integer"
      description: "Disk usage in kilobytes."
    - name: "settings.collaborators"
      type: "integer"
      description: "Number of collaborators."
    - name: "settings.plan"
      type: "object"
      description: "Billing plan: `name` (string), `space`, `collaborators`, `private_repos`, `filled_seats` and `seats` (integers). Left out unless the token may see billing details."
    - name: "settings.two_factor_requirement_enabled"
      type: "boolean"
      description: "Whether members must use two-factor authentication."
    - name: "settings.is_verified"
      type: "boolean"
      description: "Whether the organization's domains are verified."
    - name: "settings.has_organization_projects"
      type: "boolean"
      description: "Whether organization projects are enabled."
    - name: "settings.has_repository_projects"
      type: "boolean"
      description: "Whether repository projects are enabled."
    - name: "settings.default_repository_permission"
      type: "string"
      description: "Base permission members have on repositories, for example `read`."
    - name: "settings.default_repository_branch"
      type: "string"
      description: "Default branch name for new repositories."
    - name: "settings.members_can_create_repositories"
      type: "boolean"
      description: "Whether members may create repositories."
    - name: "settings.members_can_create_public_repositories"
      type: "boolean"
      description: "Whether members may create public repositories."
    - name: "settings.members_can_create_private_repositories"
      type: "boolean"
      description: "Whether members may create private repositories."
    - name: "settings.members_can_create_internal_repositories"
      type: "boolean"
      description: "Whether members may create internal repositories."
    - name: "settings.members_allowed_repository_creation_type"
      type: "string"
      description: "Which repository types members may create: `all`, `private` or `none`."
    - name: "settings.members_can_fork_private_repositories"
      type: "boolean"
      description: "Whether members may fork private repositories."
    - name: "settings.members_can_create_pages"
      type: "boolean"
      description: "Whether members may publish GitHub Pages."
    - name: "settings.members_can_create_public_pages"
      type: "boolean"
      description: "Whether members may publish public Pages sites."
    - name: "settings.members_can_create_private_pages"
      type: "boolean"
      description: "Whether members may publish private Pages sites."
    - name: "settings.members_can_create_teams"
      type: "boolean"
      description: "Whether members may create teams."
    - name: "settings.members_can_delete_repositories"
      type: "boolean"
      description: "Whether members may delete repositories."
    - name: "settings.members_can_change_repo_visibility"
      type: "boolean"
      description: "Whether members may change repository visibility."
    - name: "settings.members_can_invite_outside_collaborators"
      type: "boolean"
      description: "Whether members may invite outside collaborators."
    - name: "settings.members_can_delete_issues"
      type: "boolean"
      description: "Whether members may delete issues."
    - name: "settings.members_can_view_dependency_insights"
      type: "boolean"
      description: "Whether members may view dependency insights."
    - name: "settings.deploy_keys_enabled_for_repositories"
      type: "boolean"
      description: "Whether repositories may use deploy keys."
    - name: "settings.web_commit_signoff_required"
      type: "boolean"
      description: "Whether web-based commits must be signed off."
    - name: "settings.readers_can_create_discussions"
      type: "boolean"
      description: "Whether readers may create discussions."
    - name: "settings.display_commenter_full_name_setting_enabled"
      type: "boolean"
      description: "Whether commenters' full names are shown."
    - name: "settings.advanced_security_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether Advanced Security is on for new repositories."
    - name: "settings.dependabot_alerts_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether Dependabot alerts are on for new repositories."
    - name: "settings.dependabot_security_updates_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether Dependabot security updates are on for new repositories."
    - name: "settings.dependency_graph_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether the dependency graph is on for new repositories."
    - name: "settings.secret_scanning_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether secret scanning is on for new repositories."
    - name: "settings.secret_scanning_push_protection_enabled_for_new_repositories"
      type: "boolean"
      description: "Whether secret scanning push protection is on for new repositories."
    - name: "settings.secret_scanning_push_protection_custom_link_enabled"
      type: "boolean"
      description: "Whether a custom push protection link is shown."
    - name: "settings.secret_scanning_push_protection_custom_link"
      type: "string"
      description: "The custom push protection link."
    - name: "settings.secret_scanning_validity_checks_enabled"
      type: "boolean"
      description: "Whether secret scanning validity checks are on."
    - name: "teams"
      type: "array of objects"
      description: "Every team in the organization, all pages collected. An empty array when there are none or when the teams request failed."
    - name: "teams[].id"
      type: "integer"
      description: "Team ID. Left out when GitHub does not return it."
    - name: "teams[].node_id"
      type: "string"
      description: "GraphQL node ID. Left out when GitHub does not return it."
    - name: "teams[].name"
      type: "string"
      description: "Team name. Left out when GitHub does not return it."
    - name: "teams[].slug"
      type: "string"
      description: "URL slug of the team. Left out when GitHub does not return it."
    - name: "teams[].description"
      type: "string"
      description: "Team description. Left out when GitHub does not return it."
    - name: "teams[].privacy"
      type: "string"
      description: "`secret` or `closed`. Left out when GitHub does not return it."
    - name: "teams[].permission"
      type: "string"
      description: "Default repository permission of the team. Left out when GitHub does not return it."
    - name: "teams[].notification_setting"
      type: "string"
      description: "Team notification setting. Left out when GitHub does not return it."
    - name: "teams[].html_url"
      type: "string"
      description: "Web URL of the team. Left out when GitHub does not return it."
    - name: "teams[].url"
      type: "string"
      description: "API URL of the team. Left out when GitHub does not return it."
    - name: "teams[].members_url"
      type: "string"
      description: "API URL template for team members. Left out when GitHub does not return it."
    - name: "teams[].repositories_url"
      type: "string"
      description: "API URL of the team's repositories. Left out when GitHub does not return it."
    - name: "teams[].parent"
      type: "object"
      description: "Parent team, same fields as a team. Left out for a top-level team."
    - name: "members"
      type: "array of objects"
      description: "Organization members with the owner/admin role only, all pages collected. An empty array when there are none or when the request failed."
    - name: "members[].login"
      type: "string"
      description: "Account login. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].id"
      type: "integer"
      description: "Account ID. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].node_id"
      type: "string"
      description: "GraphQL node ID. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].type"
      type: "string"
      description: "Account type, `User`. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].site_admin"
      type: "boolean"
      description: "Whether the user is a GitHub site administrator. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].html_url"
      type: "string"
      description: "Web URL of the profile. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].url"
      type: "string"
      description: "API URL of the user. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "members[].avatar_url"
      type: "string"
      description: "Avatar image URL. Left out when GitHub does not return it. The other fields GitHub's user list returns, such as `gravatar_id` and the `*_url` links, appear the same way."
    - name: "sso"
      type: "object or null"
      description: "SAML single sign-on state. `null` when the SSO request failed with an error other than not-found, so check for it before reading `sso.enabled`."
    - name: "sso.enabled"
      type: "boolean"
      description: "True when the organization has a SAML identity provider. False when GitHub answers 404 or reports none."
    - name: "sso.sso_url"
      type: "string"
      description: "Sign-on URL of the identity provider. Empty when SSO is not enabled."
    - name: "sso.idp_issuer"
      type: "string"
      description: "Issuer of the identity provider. Empty when SSO is not enabled."
    - name: "ip_allow_list"
      type: "array of objects or null"
      description: "IP allow-list entries. Only collected when `collect_ip_allow_list` is true; `null` when it is off or when collection failed, an empty array when collected and the organization has no entries."
    - name: "ip_allow_list[].allow_list_value"
      type: "string"
      description: "IP address or CIDR range."
    - name: "ip_allow_list[].is_active"
      type: "boolean"
      description: "Whether the entry is active."
    - name: "ip_allow_list[].name"
      type: "string"
      description: "Entry name."
  example:
    settings:
      login: acme-example-org
      id: 90210
      node_id: O_kgDOExample1
      name: Acme Example Org
      description: Fictional organization used for documentation
      email: security@acme-example.test
      billing_email: billing@acme-example.test
      type: Organization
      html_url: https://github.com/acme-example-org
      url: https://api.github.com/orgs/acme-example-org
      created_at: "2021-04-12T09:30:00Z"
      updated_at: "2026-02-03T14:05:12Z"
      public_repos: 4
      total_private_repos: 31
      owned_private_repos: 31
      two_factor_requirement_enabled: true
      is_verified: true
      default_repository_permission: read
      default_repository_branch: main
      members_can_create_repositories: false
      members_can_create_public_repositories: false
      members_can_create_private_repositories: false
      members_can_fork_private_repositories: false
      members_can_delete_repositories: false
      members_can_invite_outside_collaborators: false
      web_commit_signoff_required: true
      dependabot_alerts_enabled_for_new_repositories: true
      dependency_graph_enabled_for_new_repositories: true
      secret_scanning_enabled_for_new_repositories: true
      secret_scanning_push_protection_enabled_for_new_repositories: true
    teams:
      - id: 4410001
        node_id: T_kwDOExample1
        name: Platform
        slug: platform
        description: Platform engineering
        privacy: closed
        permission: pull
        notification_setting: notifications_enabled
        html_url: https://github.com/orgs/acme-example-org/teams/platform
        url: https://api.github.com/organizations/90210/team/4410001
    members:
      - login: octo-admin-example
        id: 700001
        node_id: U_kgDOExample2
        type: User
        site_admin: false
        html_url: https://github.com/octo-admin-example
        url: https://api.github.com/users/octo-admin-example
    sso:
      enabled: true
      sso_url: https://idp.acme-example.test/saml/sso
      idp_issuer: https://idp.acme-example.test/saml/metadata
    ip_allow_list:
      - allow_list_value: 203.0.113.0/24
        is_active: true
        name: Example office
subjectTemplates:
  - name: github-organization
    description: >-
      A GitHub organization. Title: `GitHub Organization: {{ .organization }}`. The evidence also carries `provider`
      (`github`) and `type` (`organization`) labels that are not part of the identity.
    identityKeys:
      - name: "organization"
        description: "The GitHub organization login name."
    example:
      name: github-organization
      type: component
      title: "GitHub Organization: acme-example-org"
      description: GitHub organization acme-example-org
      purpose: Represents a GitHub organization being monitored for compliance
      identityLabels:
        organization: acme-example-org
