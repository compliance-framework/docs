version: 1
policyInput:
  description: >-
    The plugin evaluates one kind of resource, a Secrets Manager secret, and a policy receives one document per
    secret as `input`. The document has a `resource.type` of `secret`; the plugin never reads the secret value.
    Names and descriptions are not sent in clear text: `config.name_hash` and `config.description_hash` carry
    SHA-256 hashes written as `sha256:` followed by the hex digest. Dates are RFC 3339 strings in UTC, and are
    an empty string when AWS reports none. The table lists every field with its full path.
  fields:
    - name: "schema_version"
      type: "string"
      description: "Version of this document layout. Always `v1`."
    - name: "source"
      type: "string"
      description: "Always `aws-secretsmanager`."
    - name: "account.account_id"
      type: "string"
      description: "AWS account ID the secret belongs to."
    - name: "account.role_arn"
      type: "string"
      description: "ARN of the role the plugin assumed for the account. Empty when it used its own credentials."
    - name: "account.tags"
      type: "object (string to string)"
      description: "Tags set on the account in the plugin configuration. Not the secret's tags."
    - name: "region.name"
      type: "string"
      description: "AWS region the secret lives in."
    - name: "resource.id"
      type: "string"
      description: "The secret's friendly name followed by the six-character suffix AWS adds, the last part of the ARN."
    - name: "resource.arn"
      type: "string"
      description: "ARN of the secret."
    - name: "resource.type"
      type: "string"
      description: "Always `secret`."
    - name: "config.secret_arn"
      type: "string"
      description: "ARN of the secret, as in `resource.arn`."
    - name: "config.name_hash"
      type: "string"
      description: "Hash of the secret name."
    - name: "config.description_hash"
      type: "string"
      description: "Hash of the secret description. The hash of an empty string when there is no description."
    - name: "config.kms_key_id"
      type: "string"
      description: "KMS key that encrypts the secret. `aws/secretsmanager` when AWS reports none, which means the AWS-managed default key."
    - name: "config.rotation_enabled"
      type: "boolean"
      description: "Whether automatic rotation is turned on."
    - name: "config.rotation_lambda_arn"
      type: "string"
      description: "ARN of the Lambda function that rotates the secret. Empty when none."
    - name: "config.rotation_rules.automatically_after_days"
      type: "integer"
      description: "Days between automatic rotations. 0 when no interval is set."
    - name: "config.rotation_rules.schedule_expression"
      type: "string"
      description: "Rotation schedule as a cron or rate expression. Empty when none."
    - name: "config.rotation_rules.duration"
      type: "string"
      description: "Length of the rotation window. Empty when none."
    - name: "config.last_rotated_date"
      type: "string (RFC 3339 time)"
      description: "When the secret was last rotated. Empty when never."
    - name: "config.last_changed_date"
      type: "string (RFC 3339 time)"
      description: "When the secret or its metadata last changed. Empty when AWS reports none."
    - name: "config.last_accessed_date"
      type: "string (RFC 3339 time)"
      description: "The last day the secret value was retrieved. Empty when AWS reports none."
    - name: "config.deleted_date"
      type: "string (RFC 3339 time)"
      description: "When the secret is scheduled for deletion. Empty when it is not. A secret with a date here has no resource policy or versions in the document, because the plugin skips those calls."
    - name: "config.recovery_window_days"
      type: "integer"
      description: "Recovery window the secret was deleted with, taken from a matching CloudTrail `DeleteSecret` event. 0 when no such event was found."
    - name: "config.owning_service"
      type: "string"
      description: "AWS service that manages the secret. Empty for a secret you manage yourself."
    - name: "config.replication_status"
      type: "array of objects"
      description: "One entry per replica region: `region`, `status`, `last_accessed_date` and `status_message`, all strings. An empty array when the secret is not replicated."
    - name: "config.resource_policy_present"
      type: "boolean"
      description: "Whether the secret has a resource policy."
    - name: "config.resource_policy.hash"
      type: "string"
      description: "Hash of the policy text. Empty when there is no policy."
    - name: "config.resource_policy.document"
      type: "object or null"
      description: "The resource policy as parsed JSON. `null` when there is no policy. `{\"_parse_error\": \"...\"}` when the text is not valid JSON."
    - name: "config.resource_policy.principals"
      type: "array of objects"
      description: "One entry per principal per statement, with `principal` (string), `action` (array of strings), `condition` (the statement's condition object, or null) and `effect` (`Allow` or `Deny`). Empty when there is no policy."
    - name: "config.versions"
      type: "array of objects"
      description: "Every version of the secret, deprecated ones included: `version_id` (string), `created_date` (string), `kms_key_ids` (array of strings) and `stages` (array of strings, such as `AWSCURRENT`). Empty for a secret scheduled for deletion."
    - name: "config.deprecated_version_count"
      type: "integer"
      description: "Number of versions that have no stage label."
    - name: "dynamic.cloudtrail_events"
      type: "array of objects"
      description: "Secrets Manager CloudTrail events in the lookback window that name this secret. Each has `event_name`, `event_time`, `user_identity_arn`, `aws_region`, `event_id` (strings) and `resources` (array of strings). Raw event payloads are not included. Empty when CloudTrail returned nothing."
    - name: "dynamic.iam_credential_removal_events"
      type: "array of objects"
      description: "IAM credential-removal events, such as `DeleteAccessKey`, whose user or role appears in one of the secret's resource-policy principals. Same fields as `dynamic.cloudtrail_events`."
    - name: "tags"
      type: "object (string to string)"
      description: "The secret's own tags."
    - name: "collection.collected_at"
      type: "string (RFC 3339 time)"
      description: "When the plugin collected the data."
    - name: "collection.collector_version"
      type: "string"
      description: "Always `aws-secretsmanager`."
    - name: "collection.collection_type"
      type: "string"
      description: "`config_dynamic` when CloudTrail data was collected, otherwise `config`."
    - name: "collection.lookback_window.start"
      type: "string (RFC 3339 time)"
      description: "Start of the CloudTrail window, set by the `lookback_days` setting."
    - name: "collection.lookback_window.end"
      type: "string (RFC 3339 time)"
      description: "End of the CloudTrail window."
    - name: "collection.raw_payload_hashes"
      type: "object (string to string)"
      description: "Hashes of the raw AWS responses under `describe`, `policy` and `versions`."
    - name: "collection.errors"
      type: "array of objects"
      description: "Failures that affected only this secret, each with `scope` (the secret's ARN) and `message`. Empty when everything succeeded."
    - name: "policy_inputs"
      type: "object"
      description: "The `policy_inputs` (or `policy_input`) setting from the plugin configuration, passed through unchanged. `{}` when not set."
  example:
    schema_version: v1
    source: aws-secretsmanager
    account:
      account_id: "111122223333"
      role_arn: arn:aws:iam::111122223333:role/ccf-readonly
      tags:
        environment: prod
    region:
      name: eu-west-1
    resource:
      id: payments/db/credentials-AbCdEf
      arn: arn:aws:secretsmanager:eu-west-1:111122223333:secret:payments/db/credentials-AbCdEf
      type: secret
    config:
      secret_arn: arn:aws:secretsmanager:eu-west-1:111122223333:secret:payments/db/credentials-AbCdEf
      name_hash: sha256:9f2c4e7a1b5d83c60a47e1f2d9b8c3a5e6f70812a3b4c5d6e7f8091a2b3c4d5e
      description_hash: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      kms_key_id: arn:aws:kms:eu-west-1:111122223333:key/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
      rotation_enabled: true
      rotation_lambda_arn: arn:aws:lambda:eu-west-1:111122223333:function:rotate-db
      rotation_rules:
        automatically_after_days: 30
        schedule_expression: ""
        duration: ""
      last_rotated_date: "2026-10-12T03:00:00Z"
      last_changed_date: "2026-10-12T03:00:00Z"
      last_accessed_date: "2026-11-16T14:22:11Z"
      deleted_date: ""
      recovery_window_days: 0
      owning_service: ""
      replication_status:
        - region: eu-central-1
          status: InSync
          last_accessed_date: "2026-11-16T14:22:11Z"
          status_message: ""
      resource_policy_present: true
      resource_policy:
        hash: sha256:7d1a0c9e5b3f2a48c6e0d1f9b7a5c3e18f2d4b6a8c0e1f3a5b7d9c2e4f6a8b0c
        document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS: arn:aws:iam::111122223333:role/app-reader
              Action: secretsmanager:GetSecretValue
              Resource: "*"
        principals:
          - principal: arn:aws:iam::111122223333:role/app-reader
            action:
              - secretsmanager:GetSecretValue
            condition: null
            effect: Allow
      versions:
        - version_id: 6f3a9c1e-2b4d-4e8f-9a0b-1c2d3e4f5a6b
          created_date: "2026-10-12T03:00:00Z"
          kms_key_ids:
            - arn:aws:kms:eu-west-1:111122223333:key/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
          stages:
            - AWSCURRENT
        - version_id: 0b8e7d6c-5a4f-4e3d-8c2b-1a0f9e8d7c6b
          created_date: "2026-09-12T03:00:00Z"
          kms_key_ids:
            - arn:aws:kms:eu-west-1:111122223333:key/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
          stages:
            - AWSPREVIOUS
      deprecated_version_count: 0
    dynamic:
      cloudtrail_events:
        - event_name: RotateSecret
          event_time: "2026-10-12T03:00:00Z"
          user_identity_arn: arn:aws:sts::111122223333:assumed-role/rotate-db/rotate-db
          aws_region: eu-west-1
          event_id: 3c5e7a91-4b2d-4f68-8a0c-9d1e2f3a4b5c
          resources:
            - payments/db/credentials-AbCdEf
      iam_credential_removal_events: []
    tags:
      Owner: platform-team
      Environment: prod
      DataClassification: confidential
    collection:
      collected_at: "2026-11-17T12:00:00Z"
      collector_version: aws-secretsmanager
      collection_type: config_dynamic
      lookback_window:
        start: "2026-08-19T12:00:00Z"
        end: "2026-11-17T12:00:00Z"
      raw_payload_hashes:
        describe: sha256:b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70819203
        policy: sha256:c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7081920314
        versions: sha256:d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192031425
      errors: []
    policy_inputs: {}
subjectTemplates:
  - name: aws-secretsmanager-secret
    description: >-
      One Secrets Manager secret, evaluated for compliance posture.
      Title: `Secrets Manager secret {{ .resource_id }} in {{ .account_id }}/{{ .region }}`.
      The evidence also carries a `resource_arn` label that is not part of the identity.
    identityKeys:
      - name: "account_id"
        description: "AWS account ID."
      - name: "region"
        description: "AWS region."
      - name: "resource_id"
        description: "The secret's friendly name followed by its six-character suffix."
    example:
      name: aws-secretsmanager-secret
      type: component
      title: Secrets Manager secret payments/db/credentials-AbCdEf in 111122223333/eu-west-1
      description: AWS Secrets Manager secret payments/db/credentials-AbCdEf.
      purpose: Represents a Secrets Manager secret evaluated for compliance posture.
      identityLabels:
        account_id: "111122223333"
        region: eu-west-1
        resource_id: payments/db/credentials-AbCdEf
