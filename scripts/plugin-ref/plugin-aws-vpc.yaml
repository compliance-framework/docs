version: 1
policyInput:
  description: >-
    The plugin evaluates five kinds of resource, and a policy receives one document of the matching kind as `input`.
    Each document has two top-level keys: the resource itself, as the AWS API returns it, and a context object the
    plugin builds from the other VPC data it collected in the same region. A bundle is matched to a kind by its
    name: `aws-vpc-policies` (`vpc`), `aws-vpc-subnet-policies` (`subnet`), `aws-vpc-sg-policies` (`sg`),
    `aws-vpc-nacl-policies` (`acl`) or `aws-vpc-rt-policies` (`rt`). The resource objects and every list of related
    resources use the AWS SDK for Go field names, which are capitalised (`VpcId`, `CidrBlock`, `Tags` with `Key` and
    `Value`), and a value AWS did not return is `null`. The `current` object in each context holds the plugin's own
    summary, in snake_case. The tables list the keys of every kind, and the example shows one trimmed document of
    each kind under the key named after its bundle behavior; a real input is only the document itself, without that
    key.
  fields:
    - name: "vpc"
      type: "object"
      description: "VPC kind. The EC2 VPC (`VpcId`, `CidrBlock`, `DhcpOptionsId`, `IsDefault`, `State`, `Tags`, and the other fields of the EC2 `Vpc` type)."
    - name: "vpc_context.current"
      type: "object"
      description: "VPC kind. Summary with `vpc_id` (string), `region` (string), `cidr_block` (string), `dhcp_options_id` (string), `is_default` (boolean), `state` (string) and `tags_present` (boolean)."
    - name: "vpc_context.attributes"
      type: "object"
      description: "VPC kind. `enable_dns_support`, `enable_dns_hostnames` and `enable_network_address_usage_metrics`, each a boolean. A key is left out when AWS did not return it."
    - name: "vpc_context.dhcp_options"
      type: "object or null"
      description: "VPC kind. The DHCP options set attached to the VPC, or `null` when there is none."
    - name: "vpc_context.subnets_in_vpc"
      type: "array of objects"
      description: "VPC kind. EC2 subnets in the VPC."
    - name: "vpc_context.route_tables_in_vpc"
      type: "array of objects"
      description: "VPC kind. EC2 route tables in the VPC."
    - name: "vpc_context.internet_gateways_for_vpc"
      type: "array of objects"
      description: "VPC kind. Internet gateways attached to the VPC."
    - name: "vpc_context.vpc_endpoints_for_vpc"
      type: "array of objects"
      description: "VPC kind. VPC endpoints in the VPC."
    - name: "vpc_context.flow_logs_for_vpc"
      type: "array of objects"
      description: "VPC kind. Flow logs whose `ResourceId` is the VPC."
    - name: "vpc_context.log_groups_for_vpc_flow_logs"
      type: "array of objects"
      description: "VPC kind. CloudWatch log groups that those flow logs publish to."
    - name: "vpc_context.transit_gateway_attachments_for_vpc"
      type: "array of objects"
      description: "VPC kind. Transit gateway attachments whose `ResourceId` is the VPC."
    - name: "subnet"
      type: "object"
      description: "Subnet kind. The EC2 subnet (`SubnetId`, `VpcId`, `CidrBlock`, `AvailabilityZone`, `MapPublicIpOnLaunch`, `Tags`, and the other fields of the EC2 `Subnet` type)."
    - name: "subnet_context.current"
      type: "object"
      description: "Subnet kind. Summary with `subnet_id`, `vpc_id`, `region`, `availability_zone`, `availability_zone_id`, `cidr_block` and `state` (strings), `ipv6_cidr_block_count` and `available_ip_address_count` (integers), `map_public_ip_on_launch` and `tags_present` (booleans)."
    - name: "subnet_context.vpc"
      type: "object or null"
      description: "Subnet kind. The VPC that contains the subnet."
    - name: "subnet_context.route_tables_in_vpc"
      type: "array of objects"
      description: "Subnet kind. Route tables in the subnet's VPC."
    - name: "subnet_context.route_table_for_subnet"
      type: "object or null"
      description: "Subnet kind. The route table the subnet uses: the one it is explicitly associated with, otherwise the VPC's main route table, otherwise `null`."
    - name: "subnet_context.explicit_route_table_association"
      type: "boolean"
      description: "Subnet kind. True when a route table is explicitly associated with the subnet."
    - name: "subnet_context.network_acls_for_subnet"
      type: "array of objects"
      description: "Subnet kind. Network ACLs associated with the subnet."
    - name: "subnet_context.internet_gateways_for_vpc"
      type: "array of objects"
      description: "Subnet kind. Internet gateways attached to the subnet's VPC."
    - name: "subnet_context.flow_logs_for_vpc"
      type: "array of objects"
      description: "Subnet kind. Flow logs on the subnet's VPC."
    - name: "subnet_context.flow_logs_for_subnet"
      type: "array of objects"
      description: "Subnet kind. Flow logs on the subnet itself."
    - name: "subnet_context.log_groups_for_related_flow_logs"
      type: "array of objects"
      description: "Subnet kind. CloudWatch log groups that the VPC and subnet flow logs publish to."
    - name: "security_group"
      type: "object"
      description: "Security group kind. The EC2 security group (`GroupId`, `GroupName`, `VpcId`, `IpPermissions`, `IpPermissionsEgress`, `Tags`, and the other fields of the EC2 `SecurityGroup` type)."
    - name: "sg_context.current"
      type: "object"
      description: "Security group kind. Summary with `group_id`, `group_name`, `vpc_id` and `region` (strings), `is_default` (boolean, true when the group is named `default`) and `tags_present` (boolean)."
    - name: "sg_context.vpc"
      type: "object or null"
      description: "Security group kind. The VPC that contains the group."
    - name: "sg_context.security_groups_in_vpc"
      type: "array of objects"
      description: "Security group kind. Every security group in the VPC."
    - name: "sg_context.attached_network_interfaces"
      type: "array of objects"
      description: "Security group kind. Network interfaces that use the group."
    - name: "sg_context.attached_subnets"
      type: "array of objects"
      description: "Security group kind. Subnets of those network interfaces."
    - name: "sg_context.route_tables_in_vpc"
      type: "array of objects"
      description: "Security group kind. Route tables in the VPC."
    - name: "sg_context.route_tables_for_attached_subnets"
      type: "array of objects"
      description: "Security group kind. Route tables that apply to the attached subnets."
    - name: "sg_context.network_acls_in_vpc"
      type: "array of objects"
      description: "Security group kind. Network ACLs in the VPC."
    - name: "sg_context.network_acls_for_attached_subnets"
      type: "array of objects"
      description: "Security group kind. Network ACLs associated with the attached subnets."
    - name: "sg_context.internet_gateways_for_vpc"
      type: "array of objects"
      description: "Security group kind. Internet gateways attached to the VPC."
    - name: "sg_context.vpc_endpoints_for_vpc"
      type: "array of objects"
      description: "Security group kind. VPC endpoints in the VPC."
    - name: "sg_context.flow_logs_for_related_resources"
      type: "array of objects"
      description: "Security group kind. Flow logs on the VPC, the attached subnets or the attached network interfaces."
    - name: "sg_context.log_groups_for_related_flow_logs"
      type: "array of objects"
      description: "Security group kind. CloudWatch log groups of those flow logs."
    - name: "sg_context.transit_gateway_attachments_for_vpc"
      type: "array of objects"
      description: "Security group kind. Transit gateway attachments of the VPC."
    - name: "network_acl"
      type: "object"
      description: "Network ACL kind. The EC2 network ACL (`NetworkAclId`, `VpcId`, `IsDefault`, `Entries`, `Associations`, `Tags`, and the other fields of the EC2 `NetworkAcl` type)."
    - name: "nacl_context.current"
      type: "object"
      description: "Network ACL kind. Summary with `network_acl_id`, `vpc_id` and `region` (strings), `is_default`, `has_subnet_associations` and `tags_present` (booleans), `association_count` and `entry_count` (integers), and `associated_subnet_ids` (sorted array of strings)."
    - name: "nacl_context.vpc"
      type: "object or null"
      description: "Network ACL kind. The VPC that contains the ACL."
    - name: "nacl_context.associated_subnets"
      type: "array of objects"
      description: "Network ACL kind. Subnets the ACL is associated with."
    - name: "nacl_context.route_tables_in_vpc"
      type: "array of objects"
      description: "Network ACL kind. Route tables in the VPC."
    - name: "nacl_context.route_tables_for_associated_subnets"
      type: "array of objects"
      description: "Network ACL kind. Route tables that apply to the associated subnets."
    - name: "nacl_context.internet_gateways_for_vpc"
      type: "array of objects"
      description: "Network ACL kind. Internet gateways attached to the VPC."
    - name: "nacl_context.flow_logs_for_vpc"
      type: "array of objects"
      description: "Network ACL kind. Flow logs on the VPC."
    - name: "nacl_context.flow_logs_for_associated_subnets"
      type: "array of objects"
      description: "Network ACL kind. Flow logs on the associated subnets."
    - name: "nacl_context.log_groups_for_related_flow_logs"
      type: "array of objects"
      description: "Network ACL kind. CloudWatch log groups of those flow logs."
    - name: "nacl_context.network_interfaces_in_associated_subnets"
      type: "array of objects"
      description: "Network ACL kind. Network interfaces in the associated subnets."
    - name: "route_table"
      type: "object"
      description: "Route table kind. The EC2 route table (`RouteTableId`, `VpcId`, `OwnerId`, `Routes`, `Associations`, `PropagatingVgws`, `Tags`, and the other fields of the EC2 `RouteTable` type)."
    - name: "route_table_context.current"
      type: "object"
      description: "Route table kind. Summary. Strings: `route_table_id`, `vpc_id`, `owner_id`, `region`. Integers: `association_count`, `explicit_subnet_association_count`, `implicit_subnet_association_count`, `effective_subnet_association_count`, `gateway_association_count`, `route_count`, `blackhole_route_count`, `propagating_vgw_count`. Arrays of strings: `explicitly_associated_subnet_ids`, `implicitly_associated_subnet_ids`, `effectively_associated_subnet_ids`, `gateway_association_ids`. Booleans: `is_main`, `has_blackhole_routes`, `has_ipv4_default_route_to_internet_gateway`, `has_ipv6_default_route_to_internet_gateway`, `has_default_route_to_internet_gateway`, `has_ipv6_default_route_to_egress_only_gateway`, `has_default_route_to_nat_gateway`, `has_default_route_to_transit_gateway`, `has_default_route_to_vpc_peering_connection`, `has_gateway_endpoint_routes`, `tags_present`. Only the main route table has implicit subnets: the subnets of the VPC that no route table is explicitly associated with."
    - name: "route_table_context.vpc"
      type: "object or null"
      description: "Route table kind. The VPC that contains the route table."
    - name: "route_table_context.subnets_in_vpc"
      type: "array of objects"
      description: "Route table kind. Subnets in the VPC."
    - name: "route_table_context.explicitly_associated_subnets"
      type: "array of objects"
      description: "Route table kind. Subnets explicitly associated with the route table."
    - name: "route_table_context.implicitly_associated_subnets"
      type: "array of objects"
      description: "Route table kind. Subnets that use the route table because it is the main one."
    - name: "route_table_context.effectively_associated_subnets"
      type: "array of objects"
      description: "Route table kind. The explicit and implicit subnets together."
    - name: "route_table_context.internet_gateways_for_vpc"
      type: "array of objects"
      description: "Route table kind. Internet gateways attached to the VPC."
    - name: "route_table_context.vpc_endpoints_for_vpc"
      type: "array of objects"
      description: "Route table kind. VPC endpoints in the VPC."
    - name: "route_table_context.vpc_endpoints_for_route_table"
      type: "array of objects"
      description: "Route table kind. VPC endpoints that list this route table in `RouteTableIds`."
    - name: "route_table_context.transit_gateway_attachments_for_vpc"
      type: "array of objects"
      description: "Route table kind. Transit gateway attachments of the VPC."
    - name: "route_table_context.route_summaries"
      type: "array of objects"
      description: "Route table kind. One entry per route, with `destination` (CIDR or prefix list ID, empty when unknown), `destination_type` (`ipv4_cidr`, `ipv6_cidr`, `prefix_list` or `unknown`), `target_type` (such as `gateway`, `nat_gateway`, `transit_gateway`, `vpc_peering_connection`, `egress_only_internet_gateway`, or `unknown`), `target_id`, `state` (`active` or `blackhole`) and `origin`."
    - name: "route_table_context.blackhole_routes"
      type: "array of objects"
      description: "Route table kind. The entries of `route_summaries` whose `state` is `blackhole`."
  example:
    vpc:
      vpc:
        VpcId: vpc-0a1b2c3d4e5f60718
        CidrBlock: 10.20.0.0/16
        DhcpOptionsId: dopt-0123456789abcdef0
        IsDefault: false
        State: available
        OwnerId: "111122223333"
        Tags:
          - Key: Name
            Value: payments-prod
      vpc_context:
        current:
          vpc_id: vpc-0a1b2c3d4e5f60718
          region: eu-west-1
          cidr_block: 10.20.0.0/16
          dhcp_options_id: dopt-0123456789abcdef0
          is_default: false
          state: available
          tags_present: true
        attributes:
          enable_dns_support: true
          enable_dns_hostnames: true
          enable_network_address_usage_metrics: false
        dhcp_options:
          DhcpOptionsId: dopt-0123456789abcdef0
        subnets_in_vpc:
          - SubnetId: subnet-0f1e2d3c4b5a69788
            VpcId: vpc-0a1b2c3d4e5f60718
            CidrBlock: 10.20.1.0/24
        route_tables_in_vpc: []
        internet_gateways_for_vpc: []
        vpc_endpoints_for_vpc: []
        flow_logs_for_vpc:
          - FlowLogId: fl-0123456789abcdef0
            ResourceId: vpc-0a1b2c3d4e5f60718
            TrafficType: ALL
            LogDestinationType: cloud-watch-logs
            LogGroupName: /vpc/payments-prod/flow-logs
        log_groups_for_vpc_flow_logs:
          - LogGroupName: /vpc/payments-prod/flow-logs
            RetentionInDays: 365
        transit_gateway_attachments_for_vpc: []
    subnet:
      subnet:
        SubnetId: subnet-0f1e2d3c4b5a69788
        VpcId: vpc-0a1b2c3d4e5f60718
        CidrBlock: 10.20.1.0/24
        AvailabilityZone: eu-west-1a
        MapPublicIpOnLaunch: false
        Tags:
          - Key: Name
            Value: payments-prod-private-a
      subnet_context:
        current:
          subnet_id: subnet-0f1e2d3c4b5a69788
          vpc_id: vpc-0a1b2c3d4e5f60718
          region: eu-west-1
          availability_zone: eu-west-1a
          availability_zone_id: euw1-az3
          cidr_block: 10.20.1.0/24
          ipv6_cidr_block_count: 0
          state: available
          map_public_ip_on_launch: false
          available_ip_address_count: 243
          tags_present: true
        vpc:
          VpcId: vpc-0a1b2c3d4e5f60718
          CidrBlock: 10.20.0.0/16
        route_tables_in_vpc: []
        route_table_for_subnet:
          RouteTableId: rtb-0a9b8c7d6e5f40312
        explicit_route_table_association: true
        network_acls_for_subnet: []
        internet_gateways_for_vpc: []
        flow_logs_for_vpc: []
        flow_logs_for_subnet: []
        log_groups_for_related_flow_logs: []
    sg:
      security_group:
        GroupId: sg-0123456789abcdef0
        GroupName: payments-api
        VpcId: vpc-0a1b2c3d4e5f60718
        IpPermissions:
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            IpRanges:
              - CidrIp: 10.20.0.0/16
        IpPermissionsEgress: []
        Tags:
          - Key: Name
            Value: payments-api
      sg_context:
        current:
          group_id: sg-0123456789abcdef0
          group_name: payments-api
          vpc_id: vpc-0a1b2c3d4e5f60718
          region: eu-west-1
          is_default: false
          tags_present: true
        vpc:
          VpcId: vpc-0a1b2c3d4e5f60718
        security_groups_in_vpc: []
        attached_network_interfaces:
          - NetworkInterfaceId: eni-0123456789abcdef0
            SubnetId: subnet-0f1e2d3c4b5a69788
        attached_subnets: []
        route_tables_in_vpc: []
        route_tables_for_attached_subnets: []
        network_acls_in_vpc: []
        network_acls_for_attached_subnets: []
        internet_gateways_for_vpc: []
        vpc_endpoints_for_vpc: []
        flow_logs_for_related_resources: []
        log_groups_for_related_flow_logs: []
        transit_gateway_attachments_for_vpc: []
    acl:
      network_acl:
        NetworkAclId: acl-0123456789abcdef0
        VpcId: vpc-0a1b2c3d4e5f60718
        IsDefault: false
        Associations:
          - NetworkAclAssociationId: aclassoc-0123456789abcdef0
            SubnetId: subnet-0f1e2d3c4b5a69788
        Entries:
          - RuleNumber: 100
            RuleAction: allow
            Egress: false
            Protocol: "6"
            CidrBlock: 10.20.0.0/16
          - RuleNumber: 32767
            RuleAction: deny
            Egress: false
            Protocol: "-1"
            CidrBlock: 0.0.0.0/0
        Tags: []
      nacl_context:
        current:
          network_acl_id: acl-0123456789abcdef0
          vpc_id: vpc-0a1b2c3d4e5f60718
          region: eu-west-1
          is_default: false
          association_count: 1
          entry_count: 2
          associated_subnet_ids:
            - subnet-0f1e2d3c4b5a69788
          has_subnet_associations: true
          tags_present: false
        vpc:
          VpcId: vpc-0a1b2c3d4e5f60718
        associated_subnets: []
        route_tables_in_vpc: []
        route_tables_for_associated_subnets: []
        internet_gateways_for_vpc: []
        flow_logs_for_vpc: []
        flow_logs_for_associated_subnets: []
        log_groups_for_related_flow_logs: []
        network_interfaces_in_associated_subnets: []
    rt:
      route_table:
        RouteTableId: rtb-0a9b8c7d6e5f40312
        VpcId: vpc-0a1b2c3d4e5f60718
        OwnerId: "111122223333"
        Associations:
          - RouteTableAssociationId: rtbassoc-0123456789abcdef0
            SubnetId: subnet-0f1e2d3c4b5a69788
            Main: false
        Routes:
          - DestinationCidrBlock: 10.20.0.0/16
            GatewayId: local
            State: active
            Origin: CreateRouteTable
          - DestinationCidrBlock: 0.0.0.0/0
            NatGatewayId: nat-0123456789abcdef0
            State: active
            Origin: CreateRoute
        Tags: []
      route_table_context:
        current:
          route_table_id: rtb-0a9b8c7d6e5f40312
          vpc_id: vpc-0a1b2c3d4e5f60718
          owner_id: "111122223333"
          region: eu-west-1
          is_main: false
          association_count: 1
          explicit_subnet_association_count: 1
          implicit_subnet_association_count: 0
          effective_subnet_association_count: 1
          gateway_association_count: 0
          route_count: 2
          blackhole_route_count: 0
          explicitly_associated_subnet_ids:
            - subnet-0f1e2d3c4b5a69788
          implicitly_associated_subnet_ids: []
          effectively_associated_subnet_ids:
            - subnet-0f1e2d3c4b5a69788
          gateway_association_ids: []
          has_blackhole_routes: false
          has_ipv4_default_route_to_internet_gateway: false
          has_ipv6_default_route_to_internet_gateway: false
          has_default_route_to_internet_gateway: false
          has_ipv6_default_route_to_egress_only_gateway: false
          has_default_route_to_nat_gateway: true
          has_default_route_to_transit_gateway: false
          has_default_route_to_vpc_peering_connection: false
          has_gateway_endpoint_routes: false
          propagating_vgw_count: 0
          tags_present: false
        vpc:
          VpcId: vpc-0a1b2c3d4e5f60718
        subnets_in_vpc: []
        explicitly_associated_subnets: []
        implicitly_associated_subnets: []
        effectively_associated_subnets: []
        internet_gateways_for_vpc: []
        vpc_endpoints_for_vpc: []
        vpc_endpoints_for_route_table: []
        transit_gateway_attachments_for_vpc: []
        route_summaries:
          - destination: 10.20.0.0/16
            destination_type: ipv4_cidr
            target_type: gateway
            target_id: local
            state: active
            origin: CreateRouteTable
          - destination: 0.0.0.0/0
            destination_type: ipv4_cidr
            target_type: nat_gateway
            target_id: nat-0123456789abcdef0
            state: active
            origin: CreateRoute
        blackhole_routes: []
subjectTemplates:
  - name: aws-vpc
    description: >-
      A VPC. Title: `AWS VPC {{ .vpc_id }} in {{ .region }}`. The evidence also carries `type`, `vpc_id` and `cidr`
      labels that are not part of the identity.
    identityKeys:
      - name: "provider"
        description: "Cloud provider. Always `aws`."
      - name: "region"
        description: "AWS region."
      - name: "vpc_id"
        description: "VPC ID."
    example:
      name: aws-vpc
      type: component
      title: AWS VPC vpc-0a1b2c3d4e5f60718 in eu-west-1
      description: Amazon VPC vpc-0a1b2c3d4e5f60718 with CIDR 10.20.0.0/16 in AWS region eu-west-1.
      purpose: Represents an AWS VPC evaluated for networking compliance posture.
      identityLabels:
        provider: aws
        region: eu-west-1
        vpc_id: vpc-0a1b2c3d4e5f60718
  - name: aws-vpc-subnet
    description: >-
      A VPC subnet. Title: `AWS subnet {{ .subnet_id }} in {{ .region }}`. The evidence also carries `type`, `vpc_id`,
      `cidr` and `az` labels that are not part of the identity.
    identityKeys:
      - name: "provider"
        description: "Cloud provider. Always `aws`."
      - name: "region"
        description: "AWS region."
      - name: "subnet_id"
        description: "Subnet ID."
    example:
      name: aws-vpc-subnet
      type: component
      title: AWS subnet subnet-0f1e2d3c4b5a69788 in eu-west-1
      description: Amazon VPC subnet subnet-0f1e2d3c4b5a69788 in VPC vpc-0a1b2c3d4e5f60718 with CIDR 10.20.1.0/24.
      purpose: Represents an AWS VPC subnet evaluated for network segmentation and routing posture.
      identityLabels:
        provider: aws
        region: eu-west-1
        subnet_id: subnet-0f1e2d3c4b5a69788
  - name: aws-vpc-security-group
    description: >-
      A VPC security group. Title: `AWS security group {{ .group_id }} in {{ .region }}`. The evidence also carries
      `type` and `vpc_id` labels that are not part of the identity.
    identityKeys:
      - name: "provider"
        description: "Cloud provider. Always `aws`."
      - name: "region"
        description: "AWS region."
      - name: "group_id"
        description: "Security group ID."
    example:
      name: aws-vpc-security-group
      type: component
      title: AWS security group sg-0123456789abcdef0 in eu-west-1
      description: Amazon VPC security group sg-0123456789abcdef0 in VPC vpc-0a1b2c3d4e5f60718.
      purpose: Represents an AWS security group evaluated for network access-control posture.
      identityLabels:
        provider: aws
