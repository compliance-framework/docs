version: 1
policyInput:
  description: >-
    One document per ACM certificate, in each configured region. The plugin builds it from `ListCertificates`,
    `DescribeCertificate` and `ListTagsForCertificate`, and a policy reads it as `input`. Fields that AWS leaves
    unset are omitted, except where the table says otherwise.
  fields:
    - name: "region"
      type: "string"
      description: "AWS region the certificate lives in."
    - name: "account_id"
      type: "string"
      description: "AWS account ID, taken from the certificate ARN."
    - name: "certificate_arn"
      type: "string"
      description: "ARN of the certificate."
    - name: "domain_name"
      type: "string"
      description: "Primary domain name on the certificate."
    - name: "status"
      type: "string"
      description: "ACM status, for example `ISSUED`, `PENDING_VALIDATION`, `EXPIRED` or `REVOKED`."
    - name: "not_after"
      type: "string (RFC 3339 time)"
      description: "Time the certificate expires. Omitted when ACM has no expiry yet."
    - name: "issued_at"
      type: "string (RFC 3339 time)"
      description: "Time the certificate was issued. Omitted until it is issued."
    - name: "key_algorithm"
      type: "string"
      description: "Key algorithm with dashes replaced by underscores, for example `RSA_2048` or `EC_prime256v1`."
    - name: "type"
      type: "string"
      description: "How the certificate was obtained: `AMAZON_ISSUED`, `IMPORTED` or `PRIVATE`. Omitted when empty."
    - name: "renewal_eligibility"
      type: "string"
      description: "`ELIGIBLE` or `INELIGIBLE`. Omitted when empty."
    - name: "transparency_logging_preference"
      type: "string"
      description: "Certificate transparency logging setting, `ENABLED` or `DISABLED`. Empty when ACM returns no options."
    - name: "domain_validation_options"
      type: "array of objects"
      description: "One entry per domain on the certificate, each with `domain_name` (string) and `validation_method` (string, `DNS` or `EMAIL`)."
    - name: "in_use_by"
      type: "array of strings"
      description: "ARNs of the AWS resources that use the certificate. An empty array when none does."
    - name: "tags"
      type: "object (string to string)"
      description: "The certificate's tags. An empty object when it has none."
  example:
    region: eu-west-1
    account_id: "111122223333"
    certificate_arn: arn:aws:acm:eu-west-1:111122223333:certificate/3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    domain_name: shop.example.com
    status: ISSUED
    not_after: "2027-03-14T23:59:59Z"
    issued_at: "2026-02-12T10:15:00Z"
    key_algorithm: RSA_2048
    type: AMAZON_ISSUED
    renewal_eligibility: ELIGIBLE
    transparency_logging_preference: ENABLED
    domain_validation_options:
      - domain_name: shop.example.com
        validation_method: DNS
    in_use_by:
      - arn:aws:elasticloadbalancing:eu-west-1:111122223333:loadbalancer/app/shop/50dc6c495c0c9188
    tags:
      Environment: production
subjectTemplates:
  - name: acm-certificate
    description: >-
      An AWS ACM certificate. The plugin registers it as a component subject and attaches it to the evidence
      of every certificate it evaluates. Title: `ACM Certificate {{ .certificate_arn }}`.
    identityKeys:
      - name: "account_id"
        description: "AWS account ID."
      - name: "region"
        description: "AWS region."
      - name: "certificate_arn"
        description: "ARN of the ACM certificate."
    example:
      name: acm-certificate
      type: component
      title: "ACM Certificate arn:aws:acm:eu-west-1:111122223333:certificate/3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
      description: "AWS ACM Certificate arn:aws:acm:eu-west-1:111122223333:certificate/3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f in 111122223333/eu-west-1."
      purpose: Represents an AWS ACM certificate evaluated for compliance posture.
      identityLabels:
        account_id: "111122223333"
        region: eu-west-1
        certificate_arn: arn:aws:acm:eu-west-1:111122223333:certificate/3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
