  - id: plugin-aws-secretsmanager
    kind: plugin
    repo: compliance-framework/plugin-aws-secretsmanager
    path: plugins/aws-secretsmanager
    route: catalog/aws-secretsmanager
    label: AWS Secrets Manager
    policies:
      - compliance-framework/plugin-aws-secretsmanager-policies  # prose hint: its README says "the `aws-secretsmanager` CCF plugin"
  - id: plugin-aws-vpc
    kind: plugin
