      - compliance-framework/plugin-aws-vpc-policies         # exact name: each README names the other repo
      - compliance-framework/plugin-aws-vpc-rt-policies      # exact name: each README names the other repo
      - compliance-framework/plugin-aws-vpc-sg-policies      # exact name: each README names the other repo
