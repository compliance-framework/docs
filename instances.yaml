      - compliance-framework/plugin-github-repositories-dependency-policies  # exact name: its README names plugin-github-repositories
      - compliance-framework/plugin-github-repositories-policies             # prose hint: its README says "for use in the Github Repositories plugin"
      - compliance-framework/plugin-github-repositories-pr-policies          # prose hint: its README says "for use in the Github Repositories plugin"
