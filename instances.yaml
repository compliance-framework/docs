      - compliance-framework/plugin-aws-eks-nodegroup-policies  # exact name: each README names the other repo
      - compliance-framework/plugin-aws-eks-policies            # exact name: each README names the other repo
  - id: plugin-aws-elb
    kind: plugin
    repo: compliance-framework/plugin-aws-elb
