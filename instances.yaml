# The docs instances: one versioned Docusaurus docs plugin instance per CCF repository.
#
# docusaurus.config.ts builds the docs plugins, the navbar and the version dropdowns from this file,
# and scripts/gen-sidebars.mjs writes a sidebar for each instance. The schema is
# scripts/instances.schema.json; the generator validates this file against it on every
# `yarn start` and `yarn build`.
#
# An instance without pages (nothing under `path` and no `<id>_versions.json`) isn't built
# yet: it gets no docs plugin and no navbar item until its first pages land.
#
# scripts/sync-catalog.mjs adds an entry for every released plugin that has none, and writes the
# plugin instances' pages. A plugin's `policies` lists its policy bundles explicitly, and is
# written by hand: the script never maps a bundle by its name, and reports the bundles no plugin
# lists. Each mapped bundle carries a comment with its evidence, from the READMEs at the newest
# final releases: "exact name" when a README names or links the other repository, "prose hint"
# when the bundle's README names the plugin in words only.
version: 1
instances:
  - id: api
    kind: product
    repo: compliance-framework/api
    path: api
    route: api
    label: API
    navbar: true
    openapi: { source: docs/swagger.yaml }
  - id: ui
    kind: product
    repo: compliance-framework/ui
    path: ui
    route: ui
    label: UI
    navbar: true
  - id: agent
    kind: product
    repo: compliance-framework/agent
    path: agent
    route: agent
    label: Agent
    navbar: true
  - id: plugin-aws-ecr
    kind: plugin
    repo: compliance-framework/plugin-aws-ecr
    path: plugins/aws-ecr
    route: catalog/aws-ecr
    label: AWS ECR
    policies:
      - compliance-framework/plugin-aws-ecr-image-policies       # set in the docs-revamp LLD
      - compliance-framework/plugin-aws-ecr-registry-policies    # set in the docs-revamp LLD
      - compliance-framework/plugin-aws-ecr-repository-policies  # set in the docs-revamp LLD
  - id: plugin-apt-versions
